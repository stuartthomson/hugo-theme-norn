<head>

  <!-- https://bwaycer.github.io/hugo_tutorial.hugo/tutorials/mathjax/ -->
  <script>
    MathJax = {
      MatchWebFonts: {
        matchFor: {
          "HTML-CSS": true,
          NativeMML: false,
          SVG: false
        },
        fontCheckDelay: 2000,
        fontCheckTimeout: 30 * 1000
      },
      tex: {
        inlineMath: [['$', '$']],
        tags: 'ams' // Equation numbering
      },
      svg: {
        fontCache: 'global'
      },
      "HTML-CSS": {
        fonts: ["TeX", "STIX"],
      }

    };
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  {{ $title := print .Site.Title " | " .Title }}
  {{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
  <title>{{ $title }}</title>
  <script type="text/javascript" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
